[project]
name = "haimiya"
version = "0.1.0"
description = "Haimiya Mio artwork dispenser"
readme = "README.md"
authors = [
    { name = "Dazai", email = "358392168+nulldazai@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "aiohttp>=3.14.5",
    "quart>=0.23.1",
]

[project.scripts]
haimiya = "haimiya:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
